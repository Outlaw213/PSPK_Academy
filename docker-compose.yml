# PSPK Akademia — development stack: database, API and the web panel (http://localhost:8080). Production deployment: M11a (ADR-23).
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pspk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-pspk_academy}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"

  backend:
    build: ./backend
    image: pspk-akademia-backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pspk}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pspk_academy}
      STORAGE_ROOT: /data/storage
    volumes:
      # Photos on the server's own disk (ADR-24). In production point this at the dedicated disk.
      - ${PHOTO_STORAGE_PATH:-photo-storage}:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"

  web:
    build: ./web
    image: pspk-akademia-web
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"

volumes:
  postgres-data:
  photo-storage:
